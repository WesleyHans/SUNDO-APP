name: sundo_sipalay
description: "SUNDO: Smart Urban Navigation for Dynamic Waste Operations in Sipalay City, Negros Occidental."
publish_to: "none"
version: 1.1.1+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  http: ^1.2.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

