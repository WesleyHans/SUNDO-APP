name: sundo_sipalay
description: "SUNDO: Smart Urban Navigation for Dynamic Waste Operations in Sipalay City, Negros Occidental."
publish_to: "none"
version: 1.5.4+12

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  http: ^1.2.0
  url_launcher: 6.3.3
  shared_preferences: ^2.3.2
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.0
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  permission_handler: ^13.0.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/truck_directions/
    - assets/fonts/

