name: Build & Publish Android APK

on:
  push:
    branches: [main]
    paths:
      - "flutter_sundo/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified APK as the latest download"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_sundo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed card and weather source and tests
        run: dart format lib/features/home/widgets/sundo_card_scenery.dart lib/features/home/widgets/sundo_dashboard_widgets.dart lib/features/home/home_collection_notice.dart lib/features/home/home_screen.dart lib/shared/widgets/weather_status_banner.dart lib/shared/widgets/sundo_card_illustration.dart lib/core/utils/resident_area.dart lib/repositories/weather_repository.dart test/card_scenery_test.dart test/home_dashboard_test.dart test/home_location_schedule_test.dart test/design_preview_test.dart test/card_illustrations_test.dart test/weather_status_banner_test.dart test/weather_location_controller_test.dart test/weather_repository_test.dart

      - name: Build release APK
        run: |
          flutter analyze
          flutter test
          flutter build apk --release --dart-define=SUPABASE_URL=${SUPABASE_URL} --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/SUNDO.apk

      - name: Save verified APK for review
        uses: actions/upload-artifact@v4
        with:
          name: SUNDO-android-${{ github.run_number }}
          path: flutter_sundo/build/SUNDO.apk
          retention-days: 14

      # Hosted runners use a different debug certificate. Release artifacts
      # must be signed with the existing local key before publication so
      # residents can upgrade without uninstalling the app.
      - name: Render native scene and truck previews
        run: flutter test test/splash_environment_test.dart test/map_scene_preview_test.dart test/supplied_truck_graphics_test.dart test/directional_truck_preview_test.dart test/weather_status_banner_test.dart test/design_preview_test.dart test/home_dashboard_test.dart test/card_illustrations_test.dart --dart-define=GENERATE_PREVIEWS=true --update-goldens

      - name: Save native previews
        uses: actions/upload-artifact@v4
        with:
          name: SUNDO-previews-${{ github.run_number }}
          path: flutter_sundo/test/goldens/*.png
