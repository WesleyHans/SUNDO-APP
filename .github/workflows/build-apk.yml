name: Build & Publish Android APK

on:
  push:
    branches: [main]
    paths:
      - "flutter_sundo/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified APK as the latest download"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_sundo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter analyze
          flutter test
          flutter build apk --release --dart-define=SUPABASE_URL=${SUPABASE_URL} --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/SUNDO.apk

      - name: Save verified APK for review
        uses: actions/upload-artifact@v4
        with:
          name: SUNDO-android-${{ github.run_number }}
          path: flutter_sundo/build/SUNDO.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SUNDO Android (build ${{ github.run_number }})
          body: |
            Android APK for SUNDO – Sipalay Smart Waste Navigation.
            Download **SUNDO.apk** below and open it on your Android phone to install.
          make_latest: "true"
          files: flutter_sundo/build/SUNDO.apk
