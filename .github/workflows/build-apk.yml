name: Build & Publish Android APK

on:
  push:
    branches: [main]
    paths:
      - "flutter_sundo/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_sundo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/SUNDO.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SUNDO v1.0.0 (build ${{ github.run_number }})
          body: |
            Android APK for SUNDO – Sipalay Smart Waste Navigation.
            Download **SUNDO.apk** below and open it on your Android phone to install.
          make_latest: "true"
          files: flutter_sundo/build/SUNDO.apk
